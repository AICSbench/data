# Unit tests for .github/scripts/guard.py and the shape of guard.yml.
name: test-guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  test-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install pytest==9.2.0 pyyaml==6.0.3

      - name: Run the guard tests
        run: python -m pytest -q tests
